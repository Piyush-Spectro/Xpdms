[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "xpTDMS"
version = "0.1.0"
description = "Ultra-fast zero-copy TDMS file reader and writer written in Rust"
authors = [{ name = "Piyush Kumar" }]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[tool.maturin]
features = ["python"]
module-name = "xpTDMS"
