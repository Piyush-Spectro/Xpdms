[package]
name = "xpTDMS"
version = "0.1.0"
edition = "2024"

[lib]
name = "xpTDMS"
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "1.0"
byteorder = "1.5"
memmap2 = "0.9"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[[bench]]
name = "bench_parsing"
harness = false
